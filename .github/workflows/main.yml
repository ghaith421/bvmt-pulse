name: Mise à jour horaire des données

on:
  schedule:
    # S'exécute toutes les heures, de 07:00 à 15:00 UTC (08:00 à 16:00 heure de Tunis)
    # Du lundi au vendredi (1-5)
    - cron: '0 7-15 * * 1-5'
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright requests beautifulsoup4 lxml python-dotenv

      - name: Installation de Playwright et Chromium
        run: playwright install --with-deps chromium

      - name: Exécution du script de mise à jour
        run: python update_data.py

      - name: Commit et Push des fichiers CSV modifiés
        uses: EndBug/add-and-commit@v9
        with:
          add: 'data/*.csv'
          message: 'Mise à jour automatique des cours boursiers'
          push: true
